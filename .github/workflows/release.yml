name: Release

# One button releases the app: Actions ▸ Release ▸ Run workflow, pick the bump (patch, minor, major), and one run
#   1. bumps the last release's version, commits it on top of main and pushes only the tag v<version>,
#   2. opens a draft GitHub release with generated notes,
#   3. builds the installers on macOS, Windows and Linux and uploads them to the draft, with the latest*.yml files
#      electron-updater reads (electron-builder.yml's `publish`). Linux builds here; macOS and Windows build and sign
#      in the private Unity-Technologies/uvcs-desktop-client-release-signing, whose Sign workflow this run starts and
#      waits for: Unity's signing certificates are in Azure Key Vault, which accepts only Unity's networks, and
#      Unity's runners that reach it may serve only private repositories. It builds this repository's tag, with this
#      repository's config and sign hook, and uploads to this draft.
# Publishing the draft makes the update reach every running app within the hour (main/update/AppUpdates.ts). The
# release tags own the version: main is protected (every change through a pull request, admins and this workflow too),
# so the bump commit lives only on its tag, and main's package.json keeps whatever version it had. Never bump it by
# hand.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

# The bump's push and the upload use the built-in GITHUB_TOKEN, which needs to write contents and releases.
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the whole history, so the notes cover everything since the last tag
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      # The last release tag, not main's package.json, is the version to bump from: main never gets the bump commit.
      - name: Bump the last release's version, commit, tag and push the tag
        id: bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -n "$LAST_TAG" ]; then
            npm version "${LAST_TAG#v}" --no-git-tag-version --allow-same-version
          fi
          # --force: the line above may have edited package.json; this commit carries that edit too.
          npm version "${{ inputs.bump }}" --force -m "Release v%s"
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git push origin "$TAG"
      - name: Open a draft release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.bump.outputs.tag }}" --draft --generate-notes --title "${{ steps.bump.outputs.tag }}"

  # Linux builds from the new tag, whose package.json has the new version, and uploads its installer (unsigned: an
  # AppImage carries no signature the OS checks).
  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: ./.github/actions/install
        with:
          node-version: '26'
      - name: Build and upload
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS and Windows: the signing repo's Sign workflow builds, signs and uploads them to the same draft; this job
  # starts it and fails when it does. SIGNING_REPO_TOKEN may only start and read that repository's workflows (Actions:
  # read and write); the release environment keeps it to runs from main.
  sign:
    needs: prepare
    runs-on: ubuntu-latest
    environment: release
    env:
      SIGNING_REPO: Unity-Technologies/uvcs-desktop-client-release-signing
      GH_TOKEN: ${{ secrets.SIGNING_REPO_TOKEN }}
    steps:
      # The run is found by its title, which ends with this run's id: two releases never pick each other's.
      - name: Build and sign macOS and Windows in the signing repository
        run: |
          REQUEST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh workflow run sign-release.yml --repo "$SIGNING_REPO" -f tag="${{ needs.prepare.outputs.tag }}" -f request="$REQUEST"
          for attempt in $(seq 1 24); do
            RUN_ID="$(gh run list --repo "$SIGNING_REPO" --workflow sign-release.yml --limit 20 --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | endswith(\"($REQUEST)\")) | .databaseId" | head -n 1)"
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::The signing repository's Sign workflow didn't start."
            exit 1
          fi
          echo "Signing: https://github.com/$SIGNING_REPO/actions/runs/$RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run watch "$RUN_ID" --repo "$SIGNING_REPO" --exit-status --interval 30 > /dev/null
