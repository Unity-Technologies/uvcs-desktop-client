name: Release

# One button releases the app: Actions ▸ Release ▸ Run workflow, pick the bump (patch, minor, major), and one run
#   1. bumps the last release's version, commits it on top of main and pushes only the tag v<version>,
#   2. opens a draft GitHub release with generated notes,
#   3. builds the installers on macOS, Windows and Linux and uploads them to the draft, with the latest*.yml files
#      electron-updater reads (electron-builder.yml's `publish`).
# Publishing the draft makes the update reach every running app within the hour (main/update/AppUpdates.ts). The
# release tags own the version: main is protected (every change through a pull request, admins and this workflow too),
# so the bump commit lives only on its tag, and main's package.json keeps whatever version it had. Never bump it by
# hand.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

# The bump's push and the upload use the built-in GITHUB_TOKEN, which needs to write contents and releases.
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0 # the whole history, so the notes cover everything since the last tag
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      # The last release tag, not main's package.json, is the version to bump from: main never gets the bump commit.
      - name: Bump the last release's version, commit, tag and push the tag
        id: bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          LAST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -n "$LAST_TAG" ]; then
            npm version "${LAST_TAG#v}" --no-git-tag-version --allow-same-version
          fi
          # --force: the line above may have edited package.json; this commit carries that edit too.
          npm version "${{ inputs.bump }}" --force -m "Release v%s"
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git push origin "$TAG"
      - name: Open a draft release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ steps.bump.outputs.tag }}" --draft --generate-notes --title "${{ steps.bump.outputs.tag }}"

  # Each OS builds from the new tag, whose package.json has the new version, and uploads its own installers.
  build:
    needs: prepare
    # The signing secrets live in this environment, so only a Release run reaches them; its protection rules (required
    # reviewers) apply before any leg starts.
    environment: release
    strategy:
      # One OS failing leaves the others to finish; its leg can be re-run alone.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: ./.github/actions/install
        with:
          node-version: '26'

      # macOS signing is optional. With the CSC_LINK secret the build is signed and notarized, and updates install on a
      # restart; without it the certificate search is turned off (an empty CSC_LINK would be read as a certificate's
      # path) and the app is signed ad hoc (`identity: -`), and it updates by downloading the disk image for the user to
      # drag in (main/update/macSignature.ts). Adding the secrets switches signing on with no change here.
      # Never ship it with no signature at all: electron-builder renames Electron's app and edits its Info.plist, which
      # breaks Electron's own signature, and macOS on Apple silicon then calls the downloaded app "damaged" with no way
      # to open it. Signed ad hoc, it opens after System Settings ▸ Privacy & Security ▸ Open Anyway. The hardened
      # runtime, which only notarization needs, is off with it: under an ad-hoc signature it refuses Electron's
      # frameworks (library validation).
      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # The certificate goes into a keychain of the job's own, which electron-builder finds by itself, rather than
        # through CSC_LINK: electron-builder (26.15) unlocks the keychain it makes with the certificate's password instead
        # of the keychain's (`security set-key-partition-list -k`), which macOS 26 refuses. Apple's Developer ID
        # intermediate certificate joins it, pinned by SHA-256, so codesign can build the chain.
        run: |
          if [ -n "$CSC_LINK" ]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
            echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/DeveloperIDCA.cer" \
              https://www.apple.com/certificateauthority/DeveloperIDCA.cer
            echo "7afc9d01a62f03a2de9637936d4afe68090d2de18d03f29c88cfb0b1ba63587f  $RUNNER_TEMP/DeveloperIDCA.cer" | shasum -a 256 --check -
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/DeveloperIDCA.cer" -k "$KEYCHAIN"
            security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/certificate.p12"
            # electron-builder signs with nothing, silently, when it finds no identity: fail here instead.
            security find-identity -v -p codesigning "$KEYCHAIN" | grep -q '"Developer ID Application: '
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "macOS code signing: on"
          else
            {
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false"
              echo "MAC_SIGNING_FLAGS=-c.mac.identity=- -c.mac.hardenedRuntime=false"
            } >> "$GITHUB_ENV"
            echo "macOS code signing: ad hoc (no CSC_LINK secret)"
          fi

      # Windows signing is optional too. With the AZURE_* secrets every .exe (the app, its installers and uninstallers)
      # is signed with Unity's EV certificate in Azure Key Vault, through AzureSignTool (scripts/build/signWindows.ts),
      # and the app then installs only updates signed by the same publisher (electron-builder.windows-signed.yml);
      # without them the build is unsigned. AzureSignTool is the release's single-file build, checked against the
      # SHA-256 GitHub lists for it: a new version changes both lines.
      - name: Configure Windows code signing
        if: runner.os == 'Windows'
        shell: bash
        env:
          AZURE_KEY_VAULT_URI: ${{ secrets.AZURE_KEY_VAULT_URI }}
          AZURE_KEY_VAULT_CERTIFICATE: ${{ secrets.AZURE_KEY_VAULT_CERTIFICATE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -n "$AZURE_CLIENT_SECRET" ]; then
            TOOLS="$RUNNER_TEMP/signing"
            mkdir -p "$TOOLS"
            curl --fail --silent --show-error --location --retry 3 --output "$TOOLS/AzureSignTool.exe" \
              https://github.com/vcsjones/AzureSignTool/releases/download/v7.0.1/AzureSignTool-x64.exe
            echo "dc85a3f24bcd5978c63fcfd167a9b41313af9116722b99b831400f05f387fcba  $TOOLS/AzureSignTool.exe" | sha256sum --check -
            echo "$TOOLS" >> "$GITHUB_PATH"
            {
              echo "AZURE_KEY_VAULT_URI=$AZURE_KEY_VAULT_URI"
              echo "AZURE_KEY_VAULT_CERTIFICATE=$AZURE_KEY_VAULT_CERTIFICATE"
              echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
              echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
              echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
              echo "WINDOWS_SIGNING_FLAGS=--config electron-builder.windows-signed.yml"
            } >> "$GITHUB_ENV"
            echo "Windows code signing: on"
          else
            echo "Windows code signing: off (no AZURE_CLIENT_SECRET secret)"
          fi

      # With no platform flag electron-builder builds for the runner's OS, so each leg uploads its own installers.
      # MAC_SIGNING_FLAGS is empty except on an unsigned macOS build, WINDOWS_SIGNING_FLAGS except on a signed Windows
      # one; bash on every OS so they expand the same way.
      - name: Build and upload
        shell: bash
        run: npm run release -- $MAC_SIGNING_FLAGS $WINDOWS_SIGNING_FLAGS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
