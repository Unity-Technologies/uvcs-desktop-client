name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a pull request cancels its CI still running on older commits; master's runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# The Node used locally, so the typecheck, the tests and the build behave the same on a laptop and here.
env:
  NODE_VERSION: '26'

jobs:
  # "Done means" (CLAUDE.md): the typecheck and the tests pass, and the app builds, on every OS and architecture.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform's failures in one run: a Windows-only break shouldn't hide a macOS-only one.
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
          - { name: Linux x64, os: ubuntu-latest }
    steps:
      # The Windows arm64 runner builds on C:, a network-attached virtual disk, and leaves a local NVMe SSD raw (no
      # partition): `npm ci` of the cached packages takes about 3 minutes on C: and 30 s on that SSD. This formats it as
      # a Dev Drive and points the checkout folder (a junction, so every later step keeps its usual paths), npm's cache
      # and the temp folder at it; before the checkout, which fills that folder. Runners without a raw disk skip it
      # (Windows x64 builds on a separate D:). Timed: the tests take as long on any disk; 2 CPUs, not the disk, bound them.
      - name: Build on the local SSD
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $raw = Get-Disk | Where-Object PartitionStyle -eq 'RAW' | Select-Object -First 1
          if (-not $raw) {
            'No unused local disk: building on the default one.'
            exit 0
          }
          "Building on $($raw.FriendlyName)"
          $volume = $raw | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -UseMaximumSize -AssignDriveLetter |
            Format-Volume -DevDrive -Confirm:$false -Force
          $drive = "$($volume.DriveLetter):"
          foreach ($folder in 'workspace', 'npm-cache', 'temp') { New-Item -ItemType Directory "$drive\$folder" | Out-Null }
          Remove-Item $env:GITHUB_WORKSPACE -Recurse -Force
          New-Item -ItemType Junction -Path $env:GITHUB_WORKSPACE -Target "$drive\workspace" | Out-Null
          "npm_config_cache=$drive\npm-cache" >> $env:GITHUB_ENV
          "TEMP=$drive\temp" >> $env:GITHUB_ENV
          "TMP=$drive\temp" >> $env:GITHUB_ENV
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The smoke test (scripts/e2e/README.md): the built app over a fake cm and a temp workspace, every view.
  # Linux is left out: Electron there needs an xvfb display (`xvfb-run -a npm run e2e`), not worth the upkeep for a smoke test.
  e2e:
    name: E2E Smoke ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm run e2e
