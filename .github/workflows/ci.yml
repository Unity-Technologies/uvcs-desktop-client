name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push to a pull request cancels its CI still running on older commits; master's runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# The Node used locally, so the typecheck, the tests and the build behave the same on a laptop and here.
env:
  NODE_VERSION: '26'

jobs:
  # "Done means" (CLAUDE.md): the typecheck passes, and the tests pass and the app builds on every OS and architecture.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform's failures in one run: a Windows-only break shouldn't hide a macOS-only one.
      fail-fast: false
      matrix:
        include:
          # `smoke`: also run the smoke test (scripts/e2e/README.md), the built app over a fake cm and a temp workspace,
          # every view. Linux is left out: Electron there needs an xvfb display (`xvfb-run -a npm run e2e`), not worth
          # the upkeep for a smoke test; Windows arm64 too, as Windows x64 covers the same code. It runs in this job,
          # not one of its own, so it reuses the job's install instead of paying for a runner, a checkout and an install.
          - { name: macOS arm64, os: macos-latest, smoke: true }
          - { name: Windows x64, os: windows-latest, smoke: true }
          - { name: Windows arm64, os: windows-11-arm }
          - { name: Linux x64, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v5
      # The Windows arm64 runner builds on C:, a network-attached virtual disk, and leaves a local NVMe SSD raw (no
      # partition): `npm ci` of the cached packages takes about 3 minutes on C: and 30 s on that SSD. This formats it as
      # a Dev Drive, copies the checkout onto it and points npm's cache and the temp folder at it; the later steps run in
      # BUILD_DIR. A junction from the checkout folder was rejected: Vite then sees the project under two paths and the
      # build fails. Runners without a raw disk skip it (Windows x64 builds on a separate D:). Timed: the tests take as
      # long on any disk; 2 CPUs, not the disk, bound them.
      - name: Build on the local SSD
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $raw = Get-Disk | Where-Object PartitionStyle -eq 'RAW' | Select-Object -First 1
          if (-not $raw) {
            'No unused local disk: building on the default one.'
            exit 0
          }
          "Building on $($raw.FriendlyName)"
          $volume = $raw | Initialize-Disk -PartitionStyle GPT -PassThru | New-Partition -UseMaximumSize -AssignDriveLetter |
            Format-Volume -DevDrive -Confirm:$false -Force
          $drive = "$($volume.DriveLetter):"
          foreach ($folder in 'npm-cache', 'temp') { New-Item -ItemType Directory "$drive\$folder" | Out-Null }
          robocopy $env:GITHUB_WORKSPACE "$drive\workspace" /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          "BUILD_DIR=$drive\workspace" >> $env:GITHUB_ENV
          "npm_config_cache=$drive\npm-cache" >> $env:GITHUB_ENV
          "TEMP=$drive\temp" >> $env:GITHUB_ENV
          "TMP=$drive\temp" >> $env:GITHUB_ENV
          exit 0
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
          working-directory: ${{ env.BUILD_DIR || github.workspace }}
          reuse-node-modules: 'true'
      # Once: tsc answers the same on every OS, and Linux's case-sensitive disk makes it the strictest about import paths.
      - if: runner.os == 'Linux'
        run: npm run typecheck
        working-directory: ${{ env.BUILD_DIR || github.workspace }}
      - run: npm test
        working-directory: ${{ env.BUILD_DIR || github.workspace }}
      - if: ${{ !matrix.smoke }}
        run: npm run build
        working-directory: ${{ env.BUILD_DIR || github.workspace }}
      # The build, then the smoke test.
      - if: ${{ matrix.smoke }}
        run: npm run e2e
        working-directory: ${{ env.BUILD_DIR || github.workspace }}
