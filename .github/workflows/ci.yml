name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request on top of main before merging it (docs/features/updates.md "CI").
  merge_group:

# CI only reads the code: its token can't push, comment or touch releases, whoever opened the pull request.
permissions:
  contents: read

# A new push to a pull request cancels its CI still running on older commits; main's runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # "Done means" (CLAUDE.md): the typecheck passes, and the tests pass and the app builds on every OS and architecture.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform's failures in one run: a Windows-only break shouldn't hide a macOS-only one.
      fail-fast: false
      matrix:
        include:
          # `smoke`: also run the smoke test (scripts/e2e/README.md), the built app over a fake cm and a temp workspace,
          # every view. Linux is left out: Electron there needs an xvfb display (`xvfb-run -a npm run e2e`), not worth
          # the upkeep for a smoke test; Windows arm64 too, as Windows x64 covers the same code. It runs in this job,
          # not one of its own, so it reuses the job's install instead of paying for a runner, a checkout and an install.
          - { name: macOS arm64, os: macos-latest, smoke: true }
          - { name: Windows x64, os: windows-latest, smoke: true }
          - { name: Windows arm64, os: windows-11-arm }
          - { name: Linux x64, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Windows' local SSD and macOS' temp folder in memory: why, in the action.
      - uses: ./.github/actions/fast-disks
      - uses: ./.github/actions/install
        with:
          working-directory: ${{ env.BUILD_DIR || github.workspace }}
          reuse-node-modules: 'true'
      # Once: tsc answers the same on every OS, and Linux's case-sensitive disk makes it the strictest about import paths.
      - if: runner.os == 'Linux'
        run: npm run typecheck
        working-directory: ${{ env.BUILD_DIR || github.workspace }}
      - run: npm test
        working-directory: ${{ env.BUILD_DIR || github.workspace }}
      - if: ${{ !matrix.smoke }}
        run: npm run build
        working-directory: ${{ env.BUILD_DIR || github.workspace }}
      # The smoke test over a development build (React's StrictMode), then over the production build.
      - if: ${{ matrix.smoke }}
        run: npm run e2e
        working-directory: ${{ env.BUILD_DIR || github.workspace }}
        env:
          # In the temp folder the steps above chose: on macOS the disk in memory, whose writes never stall.
          UVCS_E2E_SHOTS: ${{ env.TMPDIR || env.TEMP || runner.temp }}/uvcs-e2e-shots
      # A failed smoke test keeps its screenshots, the failed step's included: a run that fails now and then can be read
      # only from what it left.
      - if: ${{ matrix.smoke && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-screenshots-${{ matrix.name }}
          path: ${{ env.TMPDIR || env.TEMP || runner.temp }}/uvcs-e2e-shots
          if-no-files-found: ignore
          # A re-run of the job replaces the screenshots it kept, rather than failing on the name.
          overwrite: true
