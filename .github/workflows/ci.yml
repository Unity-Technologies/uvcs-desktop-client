name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request on top of main before merging it (docs/features/updates.md "CI").
  merge_group:

# CI only reads the code: its token can't push, comment or touch releases, whoever opened the pull request.
permissions:
  contents: read

# A new push to a pull request cancels its CI still running on older commits; main's runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # "Done means" (CLAUDE.md): the typecheck passes, and the tests pass and the app builds on every OS and architecture.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform's failures in one run: a Windows-only break shouldn't hide a macOS-only one.
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
          - { name: Windows arm64, os: windows-11-arm }
          - { name: Linux x64, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Why each: in the action. The temp folder moves after the install, which needs more room than the disk in memory.
      - uses: ./.github/actions/build-on-local-ssd
      - uses: ./.github/actions/install
        with:
          working-directory: ${{ env.BUILD_DIR || github.workspace }}
          reuse-node-modules: 'true'
      - uses: ./.github/actions/temp-in-memory
      # Once: tsc answers the same on every OS, and Linux's case-sensitive disk makes it the strictest about import paths.
      - if: runner.os == 'Linux'
        run: npm run typecheck
        working-directory: ${{ env.BUILD_DIR || github.workspace }}
      - run: npm test
        working-directory: ${{ env.BUILD_DIR || github.workspace }}
      - run: npm run build
        working-directory: ${{ env.BUILD_DIR || github.workspace }}

  # The smoke test (scripts/e2e/README.md): the built app over a fake cm and a temp workspace, every view. Its own jobs,
  # one per build, run beside the tests rather than after them: in the build job, the tests then the two smoke runs
  # took about 6 minutes on macOS, where these take about 2 each, for one more install from the node_modules cache.
  # Linux is left out: Electron there needs an xvfb display (`xvfb-run -a npm run e2e`), not worth the upkeep for a
  # smoke test; Windows arm64 too, as Windows x64 covers the same code.
  smoke:
    name: Smoke test, ${{ matrix.platform.name }}, ${{ matrix.build }} build
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
        # `development`: React's development build, whose StrictMode mounts every component twice (a bug only
        # `npm run dev` shows); `production`: what ships.
        build: [development, production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build-on-local-ssd
      - uses: ./.github/actions/install
        with:
          working-directory: ${{ env.BUILD_DIR || github.workspace }}
          reuse-node-modules: 'true'
      - uses: ./.github/actions/temp-in-memory
      - run: npm run e2e:${{ matrix.build }}
        working-directory: ${{ env.BUILD_DIR || github.workspace }}
        env:
          # In the temp folder the steps above chose: on macOS the disk in memory, whose writes never stall.
          UVCS_E2E_SHOTS: ${{ env.TMPDIR || env.TEMP || runner.temp }}/uvcs-e2e-shots
      # A failed smoke test keeps its screenshots, the failed step's included: a run that fails now and then can be read
      # only from what it left.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-screenshots-${{ matrix.platform.name }}-${{ matrix.build }}
          path: ${{ env.TMPDIR || env.TEMP || runner.temp }}/uvcs-e2e-shots
          if-no-files-found: ignore
          # A re-run of the job replaces the screenshots it kept, rather than failing on the name.
          overwrite: true

  # The one check branch protection requires of this workflow (docs/features/updates.md "CI"): it fails unless every
  # job passed, so a new or renamed job needs no change to the protection rules. `if: always()`, because a job skipped
  # after a failure counts as passed for a required check; a skipped job here counts as failed.
  ci-result:
    name: CI result
    needs: [build, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A CI job failed, was cancelled or was skipped."
          exit 1
      - run: echo "Every CI job passed."
