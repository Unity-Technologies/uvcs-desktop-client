name: CodeQL

# GitHub's security analysis of the JavaScript and TypeScript: the kinds of flaw an app that builds `cm` command lines
# and touches the file system can have (command and path injection, unsafe temp files, prototype pollution...).
# Findings show in the repository's Security tab and on pull requests.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, so queries CodeQL publishes later also check code that hasn't changed. Monday 06:00 UTC.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      # Code scanning is free on public repositories only; a private one needs GitHub Advanced Security. Until the
      # repository is public the job passes without scanning, and scans from the first run after, with no edit here.
      # Asked of the API rather than read from the event, which a scheduled run doesn't carry.
      - name: Code scanning available
        id: available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" = true ]; then
            echo "::notice::Skipped: code scanning needs a public repository (or GitHub Advanced Security)."
            echo "scan=false" >> "$GITHUB_OUTPUT"
          else
            echo "scan=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.available.outputs.scan == 'true'
        uses: actions/checkout@v5

      # The default query suite, the security baseline: security-and-quality adds noise for little signal.
      # build-mode none: JavaScript and TypeScript are analyzed from the sources, with no build.
      - if: steps.available.outputs.scan == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - if: steps.available.outputs.scan == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
