name: CodeQL

# GitHub's security analysis of the JavaScript and TypeScript: the kinds of flaw an app that builds `cm` command lines
# and touches the file system can have (command and path injection, unsafe temp files, prototype pollution...).
# Findings show in the repository's Security tab and on pull requests. Code scanning is free on a public repository.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so queries CodeQL publishes later also check code that hasn't changed. Monday 06:00 UTC.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: CodeQL
    # A private repository can't use code scanning without GitHub Advanced Security, so the job would fail on every
    # pull request; it skips until the repository is public, then runs by itself.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The default query suite, the security baseline: security-and-quality adds noise for little signal.
      # build-mode none: JavaScript and TypeScript are analyzed from the sources, with no build.
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
