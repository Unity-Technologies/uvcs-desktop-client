appId: com.unity.uvcs-desktop
directories:
  output: dist
  buildResources: build
# electron-vite bundles everything the app runs into out/ (its libraries are devDependencies),
# so there are no node_modules to ship or native modules to rebuild.
files:
  - out/**
  - '!out/THIRD_PARTY_NOTICES.txt'
  - package.json
npmRebuild: false
# Packs the Windows installer's archive with a filter its extractor can read: the arm64 installer otherwise leaves out
# the app's .exe and DLLs.
beforePack: ./scripts/build/windowsInstallerFilter.ts

# The app's license, and the notices of the libraries bundled into out/ (written by the build:
# scripts/build/thirdPartyNoticesPlugin.ts), as plain files in the app's resources folder, where the About dialog opens
# the notices from (a file inside app.asar can't be opened by another app). Electron's own LICENSE and
# LICENSES.chromium.html ship with Electron.
extraResources:
  - LICENSE.md
  - from: out/THIRD_PARTY_NOTICES.txt
    to: THIRD_PARTY_NOTICES.txt

# The update feed (main/update/releaseFeed.ts names the same repository). `npm run release` uploads the installers and
# the latest*.yml files electron-updater reads to the release tagged v<version>; it needs GH_TOKEN.
publish:
  provider: github
  owner: Unity-Technologies
  repo: uvcs-desktop-client

# File names without spaces (GitHub turns them into dots, which the latest*.yml would no longer match), naming each
# OS and architecture: the unsigned macOS update picks its disk image by `-macOS-<arch>.dmg` (installerAsset).
mac:
  category: public.app-category.developer-tools
  # The app's icons (here, win and linux) are made from its mark by `npm run icons` (scripts/icons/makeAppIcons.mjs);
  # the disk image and the Windows installer show them too.
  icon: build/icon.icns
  artifactName: UnityVersionControl-${version}-macOS-${arch}.${ext}
  # One installer per architecture, half the size of a universal one; electron-updater needs the zip on macOS. The
  # targets name no architecture, so each run builds the ones its command line names (the Mac's own when it names
  # none): releases build x64 and arm64 in two runs at once, so Apple notarizes both apps at the same time, and join
  # their latest-mac.yml (scripts/build/mergeMacUpdateInfo.ts).
  target: [dmg, zip]
win:
  icon: build/icon.ico
  artifactName: UnityVersionControl-${version}-Windows-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64, arm64]
linux:
  icon: build/icons
  artifactName: UnityVersionControl-${version}-Linux-${arch}.${ext}
  target: AppImage
